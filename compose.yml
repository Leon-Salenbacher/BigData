services:
  controller:
    build: ./setup/cloud
    image: bigdata-controller-image
    container_name: bigdata-controller

    env_file:
      - .env

    stop_grace_period: 120s

    volumes:
      - type: bind
        source: ./infra/terraform.tfvars.json
        target: /config/terraform.tfvars.json
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./data
        target: /workspace/data
        read_only: true
        
      - type: bind
        source: ./setup/hadoop
        target: /workspace/setup/hadoop
        read_only: true

      - type: bind
        source: ${GCP_KEY_FILE}
        target: /secrets/gcp-key.json
        read_only: true

      - type: volume
        source: ssh-keys
        target: /root/.ssh

volumes:
  ssh-keys:
    name: bigdata-ssh
